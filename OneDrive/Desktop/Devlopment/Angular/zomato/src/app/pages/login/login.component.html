
  <div class="login-container">
    <div class="login-header">
      <h2>Login</h2>
    </div>

    <div class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input [(ngModel)]="loginObj.username" type="text" id="username" name="username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input [(ngModel)]="loginObj.password" type="password" id="password" name="pas" required>
      </div>

      <button class="login-btn" type="submit" (click)="onLogin()">Login</button>
    </div>
  </div>
